name: Build custom Docker images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: ./Dockerfile
            image_name: subtracker-api:boogay-custom
          - image: web
            dockerfile: ./docker/web.Dockerfile
            image_name: subtracker-web:boogay-custom

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          build-args: |
            VITE_APP_VERSION=boogay-${{ github.sha }}
          tags: ${{ matrix.image_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-linux-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-linux-amd64
          provenance: false
          sbom: false

      - name: Export image archive
        shell: bash
        run: docker save "${{ matrix.image_name }}" | gzip -1 > "${{ runner.temp }}/subtracker-${{ matrix.image }}-boogay-custom.tar.gz"

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: subtracker-${{ matrix.image }}-boogay-custom
          path: ${{ runner.temp }}/subtracker-${{ matrix.image }}-boogay-custom.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
